---
apiVersion: v1
kind: Service
metadata:
  name: datanode
  namespace: crypto-bigdata
spec:
  ports:
  - port: 9864
    name: http
  - port: 9866
    name: data
  - port: 9867
    name: ipc
  clusterIP: None
  selector:
    app: datanode

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datanode
  namespace: crypto-bigdata
spec:
  serviceName: datanode
  replicas: 2
  selector:
    matchLabels:
      app: datanode
  template:
    metadata:
      labels:
        app: datanode
    spec:
      # Run as root to fix permissions
      securityContext:
        runAsUser: 0
        fsGroup: 0
      initContainers:
      - name: fix-permissions
        image: busybox
        command:
        - sh
        - -c
        - |
          mkdir -p /hadoop/dfs/data
          chmod -R 777 /hadoop/dfs/data
          chown -R 1000:1000 /hadoop/dfs/data
        volumeMounts:
        - name: data
          mountPath: /hadoop/dfs/data
      containers:
      - name: datanode
        image: apache/hadoop:3.3.6
        ports:
        - containerPort: 9864
          name: http
        - containerPort: 9866
          name: data
        - containerPort: 9867
          name: ipc
        env:
        - name: HDFS_DATANODE_USER
          value: "root"
        command:
        - sh
        - -c
        - |
          # Wait for namenode
          echo "Waiting for NameNode..."
          until hdfs dfsadmin -report 2>/dev/null; do
            echo "NameNode not ready, waiting..."
            sleep 5
          done
          
          echo "Starting DataNode..."
          hdfs datanode
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /hadoop/dfs/data
        - name: config
          mountPath: /opt/hadoop/etc/hadoop/core-site.xml
          subPath: core-site.xml
        - name: config
          mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
          subPath: hdfs-site.xml
        livenessProbe:
          httpGet:
            path: /
            port: 9864
          initialDelaySeconds: 90
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9864
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: hdfs-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi