---
apiVersion: v1
kind: Service
metadata:
  name: namenode
  namespace: crypto-bigdata
spec:
  ports:
  - port: 9000
    name: fs
    targetPort: 9000
  - port: 9870
    name: http
    targetPort: 9870
  selector:
    app: namenode
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: namenode
  namespace: crypto-bigdata
spec:
  serviceName: namenode
  replicas: 1
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 0
      initContainers:
      - name: fix-permissions
        image: busybox
        command:
        - sh
        - -c
        - |
          mkdir -p /hadoop/dfs/name
          chmod -R 777 /hadoop/dfs/name
          chown -R 1000:1000 /hadoop/dfs/name
        volumeMounts:
        - name: data
          mountPath: /hadoop/dfs/name
      containers:
      - name: namenode
        image: apache/hadoop:3.3.6
        ports:
        - containerPort: 9000
          name: fs
        - containerPort: 9870
          name: http
        env:
        - name: CLUSTER_NAME
          value: "crypto-cluster"
        command:
        - sh
        - -c
        - |
          # Format NameNode if not already formatted 
          if [ ! -d /hadoop/dfs/name/current ]; then
            echo "Formatting NameNode..."
            hdfs namenode -format -force -clusterId CID-crypto-bigdata
          else
            echo "NameNode already formatted."
          fi
          
          echo "Starting NameNode..."
          hdfs namenode
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /hadoop/dfs/name
        - name: config
          mountPath: /opt/hadoop/etc/hadoop/core-site.xml
          subPath: core-site.xml
        - name: config
          mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
          subPath: hdfs-site.xml
        livenessProbe:
          httpGet:
            path: /
            port: 9870
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9870
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: hdfs-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi