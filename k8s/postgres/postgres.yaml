---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: crypto-bigdata
data:
  init.sql: |    
    -- 1. Bảng lưu dữ liệu thô Real-time (Từ Spark Streaming)
    CREATE TABLE IF NOT EXISTS realtime_prices (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(20) NOT NULL,
        name VARCHAR(100),
        price NUMERIC(20, 8) NOT NULL,
        volume_24h NUMERIC(30, 2),
        market_cap NUMERIC(30, 2),
        price_change_24h NUMERIC(10, 4),
        price_change_percentage_24h NUMERIC(10, 4),
        ma_5min NUMERIC(20, 8),
        ma_15min NUMERIC(20, 8),
        ma_1hour NUMERIC(20, 8),
        timestamp TIMESTAMP NOT NULL DEFAULT NOW(),
        created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX idx_realtime_prices_symbol ON realtime_prices(symbol);
    CREATE INDEX idx_realtime_prices_timestamp ON realtime_prices(timestamp DESC);
    
    -- 2. Bảng Alerts (Cảnh báo)
    CREATE TABLE IF NOT EXISTS alerts (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(20) NOT NULL,
        alert_type VARCHAR(50) NOT NULL,
        message TEXT,
        price_before NUMERIC(20, 8),
        price_after NUMERIC(20, 8),
        change_percentage NUMERIC(10, 4),
        volume NUMERIC(30, 2),
        timestamp TIMESTAMP NOT NULL,
        created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX idx_alerts_symbol ON alerts(symbol);
    CREATE INDEX idx_alerts_timestamp ON alerts(timestamp DESC);

    -- 3. Bảng Thống kê theo Giờ (Từ Batch Job)
    CREATE TABLE IF NOT EXISTS hourly_stats (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(20) NOT NULL,
        hour_timestamp TIMESTAMP NOT NULL,
        open_price NUMERIC(20, 8),
        high_price NUMERIC(20, 8),
        low_price NUMERIC(20, 8),
        close_price NUMERIC(20, 8),
        avg_price NUMERIC(20, 8),
        total_volume NUMERIC(30, 2),
        avg_volume NUMERIC(30, 2),
        avg_market_cap NUMERIC(30, 2),
        price_volatility NUMERIC(20, 8),
        record_count INTEGER,
        created_at TIMESTAMP DEFAULT NOW(),
        UNIQUE(symbol, hour_timestamp)
    );
    CREATE INDEX idx_hourly_stats_symbol ON hourly_stats(symbol);
    
    -- 4. Bảng Thống kê theo Ngày (Từ Batch Job)
    CREATE TABLE IF NOT EXISTS daily_stats (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(20) NOT NULL,
        day_timestamp DATE NOT NULL,
        open_price NUMERIC(20, 8),
        high_price NUMERIC(20, 8),
        low_price NUMERIC(20, 8),
        close_price NUMERIC(20, 8),
        avg_price NUMERIC(20, 8),
        total_volume NUMERIC(30, 2),
        peak_volume NUMERIC(30, 2),
        price_change_percent NUMERIC(10, 4),
        volatility NUMERIC(20, 8),
        transaction_count INTEGER,
        created_at TIMESTAMP DEFAULT NOW(),
        UNIQUE(symbol, day_timestamp)
    );
    CREATE INDEX idx_daily_stats_symbol ON daily_stats(symbol);
    
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: crypto-bigdata
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: crypto-bigdata
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "cryptodb"
        - name: POSTGRES_USER
          value: "cryptouser"
        - name: POSTGRES_PASSWORD
          value: "cryptopass123"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-script
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi