---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: crypto-bigdata
spec:
  ports:
  - port: 7077
    name: master
    targetPort: 7077
  - port: 8080
    name: ui
    targetPort: 8080
  selector:
    app: spark-master
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: crypto-bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: apache/spark:3.5.0
        ports:
        - containerPort: 7077
          name: master
        - containerPort: 8080
          name: ui
        env:
        - name: SPARK_NO_DAEMONIZE
          value: "true"
        command:
        - /bin/bash
        - -c
        - |
          export SPARK_MASTER_HOST=0.0.0.0
          export SPARK_MASTER_PORT=7077
          export SPARK_MASTER_WEBUI_PORT=8080
          
          /opt/spark/sbin/start-master.sh
          
          # Keep container running
          tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-*.out
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1280Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10